<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Daily Command Center — By Maanas Jain</title>
<style>
*{box-sizing:border-box} :root{--bg:#080a0f;--panel:#10131a;--panel2:#161a22;--line:#282d38;--text:#f6f7fa;--muted:#969daa;--accent:#8d80ff;--accent2:#b9b0ff;--good:#54d69b;--warn:#f2bd68;--bad:#f17b7b;--shadow:0 25px 80px #0008}
.light{--bg:#f5f6fa;--panel:#fff;--panel2:#eef0f6;--line:#dfe2ea;--text:#11141b;--muted:#687080;--accent:#6759e9;--accent2:#5547d0;--shadow:0 20px 60px #26304a1a}
body{margin:0;background:radial-gradient(circle at 80% -10%,#292044 0,#080a0f 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}
.app{min-height:100vh;display:flex}.side{position:fixed;z-index:20;inset:0 auto 0 0;width:255px;padding:24px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px);display:flex;flex-direction:column}
.logo{display:flex;gap:11px;align-items:center;font-weight:800;font-size:15px}.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#5b4fd2);display:grid;place-items:center;font-size:11px}.by{margin:9px 0 28px 51px;color:var(--muted);font-size:10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.sidebottom{margin-top:auto}.user{border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;gap:9px;align-items:center;background:var(--panel)}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:700;font-size:11px}.user small{display:block;color:var(--muted)}
main{margin-left:255px;width:calc(100% - 255px)}.top{height:70px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:#080a0fd9;backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;padding:0 32px}.light .top{background:#f5f6fad9}.top h3{font-size:17px;margin:0}.topactions{display:flex;gap:8px}.icon,.btn,.mini{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px}.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),#6659dc);font-weight:750}.wrap{max-width:1450px;margin:auto;padding:30px 32px 70px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--accent2);letter-spacing:.15em;text-transform:uppercase;font-weight:800}.hero h1{font-size:35px;letter-spacing:-.04em;margin:7px 0}.hero p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 75%,#000));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 40px #0001}.scorecard{grid-row:span 2;min-height:290px;display:flex;flex-direction:column;justify-content:space-between}.score{font-size:67px;font-weight:800;letter-spacing:-.08em}.score span{font-size:18px;color:var(--muted);letter-spacing:0}.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.ring{width:120px;height:120px;border-radius:50%;margin:5px auto;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0)}.ring:after{content:"";position:absolute;width:89px;height:89px;background:var(--panel);border-radius:50%}.ring b{position:relative;z-index:1}.metric{display:flex;justify-content:space-between;align-items:center}.metric b{font-size:23px}.muted{color:var(--muted)}.sect{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}.sect h2{font-size:17px;margin:0}.tasks{display:grid;gap:8px}.task{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px}.tick{width:22px;height:22px;border-radius:7px;border:1px solid #484e5b;background:transparent}.tick.done{background:var(--good);border-color:var(--good);color:#06140d}.task.done .name{text-decoration:line-through;color:var(--muted)}.name{font-weight:700}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.pill{font-size:10px;background:var(--panel2);color:var(--muted);border-radius:6px;padding:4px 7px}.critical{background:#371f26;color:#ff9999}.high{background:#382d1e;color:#ffd17d}.bonus{background:#292343;color:#c0b6ff}.taskops{display:flex;gap:5px}.mini{font-size:11px;padding:6px 8px;color:var(--muted)}.next{display:flex;align-items:center;justify-content:space-between;gap:12px}.next strong{font-size:18px}.chart{height:190px;display:flex;align-items:end;gap:9px}.bar{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(to top,var(--accent),var(--accent2));min-height:5px}.listrow{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.goal{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.goal h3{margin:0 0 4px}.status{font-size:10px;padding:5px 8px;border-radius:7px}.ok{background:#183428;color:var(--good)}.risk{background:#392d1d;color:var(--warn)}
.modal{position:fixed;z-index:100;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.dialog{width:min(590px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0 0 10px}label{display:block;color:var(--muted);font-size:11px;margin:11px 0}input,select,textarea{width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);outline:0}textarea{min-height:90px;resize:vertical}.twoform{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto;margin:0}.toast{position:fixed;z-index:200;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:10px;font-weight:750;box-shadow:var(--shadow)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#292044,#080a0f 45%)}.authbox{width:min(460px,100%);background:#11141bdd;border:1px solid #2a2e39;border-radius:22px;padding:29px;box-shadow:var(--shadow)}.authbox h1{font-size:30px}.authbox p{color:#9aa1af;line-height:1.5}.authbox input{background:#0b0e14}.mobile{display:none}
@media(max-width:850px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.mobile{display:block}main{margin:0;width:100%}.top{padding:0 16px}.wrap{padding:23px 16px}.grid,.two{grid-template-columns:1fr}.scorecard{grid-row:auto}.hero{align-items:flex-start}.task{grid-template-columns:26px 1fr}.taskops{grid-column:2}.twoform{grid-template-columns:1fr}}
@media(max-width:500px){.topactions .icon:nth-child(2){display:none}.hero h1{font-size:28px}.topactions{gap:5px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* DAILY COMMAND CENTER — single-file application
   Persistent data is stored locally in this browser. This deliberately never
   pretends external AI/telephony are connected without provider credentials. */
const K="dcc_single_file_v3";
const DEFAULT={user:null,tasks:[],goals:[],reviews:[],events:[],theme:"dark",settings:{notifications:true,lowData:false,aiMemory:true,voice:true}};
let S=JSON.parse(localStorage.getItem(K)||"null")||DEFAULT;
const $=q=>document.querySelector(q), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pri=t=>({Critical:0,High:1,Medium:2,Low:3,Bonus:4}[t.priority]??9);
function save(){localStorage.setItem(K,JSON.stringify(S))}
function toast(x){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.append(t)}t.textContent=x;t.classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add("hidden"),2200)}
function weightedScore(){let total=S.tasks.reduce((a,t)=>a+t.weight,0),done=S.tasks.filter(t=>t.status==="completed").reduce((a,t)=>a+t.weight,0);return total?Math.round(done/total*100):0}
function completion(){return S.tasks.length?Math.round(S.tasks.filter(t=>t.status==="completed").length/S.tasks.length*100):0}
function shell(title,body){return `<div class="app"><aside class="side" id="side"><div class="logo"><div class="mark">DC</div><div>Daily Command<br>Center</div></div><div class="by">By Maanas Jain</div><nav class="nav">${[["today","⌂ Today"],["lists","☷ Lists"],["calendar","▦ Calendar"],["stats","◒ Stats"],["goals","◎ Goals"],["coach","✦ AI Coach"],["review","✎ Daily Review"],["templates","▤ Templates"],["settings","⚙ Settings"]].map(x=>`<button class="${VIEW===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav><div class="sidebottom"><div class="by">By Maanas Jain</div><div class="user"><div class="avatar">${esc((S.user.name||"MJ").slice(0,2).toUpperCase())}</div><div><b>${esc(S.user.name)}</b><small>Private workspace</small></div></div></div></aside><main><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="icon mobile" onclick="$('#side').classList.toggle('open')">☰</button><h3>${title}</h3></div><div class="topactions"><button class="icon" onclick="toggleTheme()">◐</button><button class="icon" onclick="voice()">🎙</button><button class="btn primary" onclick="taskModal()">+ Add task</button></div></header><div class="wrap">${body}</div></main></div>`}
let VIEW="today";
function go(v){VIEW=v;render()}
function render(){if(!S.user)return auth();let f={today:today,lists:lists,calendar:calendar,stats:stats,goals:goals,coach:coach,review:review,templates:templates,settings:settings}[VIEW]||today;$("#root").innerHTML=f()}
function task(t){return `<div class="task ${t.status==="completed"?"done":""}"><button class="tick ${t.status==="completed"?"done":""}" onclick="toggleTask('${t.id}')">${t.status==="completed"?"✓":""}</button><div><div class="name">${esc(t.name)}</div><div class="meta"><span class="pill ${t.priority==="Critical"?"critical":t.priority==="High"?"high":t.priority==="Bonus"?"bonus":""}">${esc(t.priority)}</span><span class="pill">${esc(t.category)}</span><span class="pill">${t.duration} min · ${t.weight} pts</span>${t.nonneg?'<span class="pill">Non-negotiable</span>':""}${t.recurrence?`<span class="pill">↻ ${esc(t.recurrence)}</span>`:""}</div></div><div class="taskops"><button class="mini" onclick="taskModal('${t.id}')">Edit</button><button class="mini" onclick="delTask('${t.id}')">×</button></div></div>`}
function today(){let s=weightedScore(),n=S.tasks.filter(t=>t.status!=="completed").sort((a,b)=>pri(a)-pri(b))[0],mins=S.tasks.filter(t=>t.status!=="completed").reduce((a,t)=>a+t.duration,0);return shell("Today",`<div class="hero"><div><div class="eyebrow">Your command center</div><h1>Good ${new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening"}, ${esc(S.user.name)}.</h1><p>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})} · Know what matters. Do what matters.</p></div></div><div class="grid"><div class="card scorecard"><div><div class="eyebrow">Daily execution</div><div class="score">${s}<span>/100</span></div><div class="progress"><i style="width:${s}%"></i></div></div><div class="ring" style="--p:${completion()}"><b>${completion()}%</b></div><div class="metric"><span class="muted">Current streak</span><b>${calcStreak()} days</b></div></div><div class="card"><div class="eyebrow">Next action</div><div class="next" style="margin-top:14px"><div><strong>${n?esc(n.name):"All important work complete"}</strong><div class="muted">${n?n.duration+" min · "+n.priority:"Perfect time to review your progress."}</div></div>${n?`<button class="btn primary" onclick="focusMode('${n.id}')">START</button>`:""}</div></div><div class="card"><div class="eyebrow">7-day consistency</div><div class="metric" style="margin:14px 0"><b>${consistency()}</b><span class="muted">/100</span></div><div class="progress"><i style="width:${consistency()}%"></i></div></div><div class="card"><div class="eyebrow">Workload</div><div class="metric" style="margin:14px 0"><b>${mins}m</b><span class="muted">remaining</span></div><div class="muted">${mins>480?"YOUR DAY LOOKS OVERLOADED — use Recovery Mode.":"Your current workload looks manageable."}</div></div><div class="card"><div class="eyebrow">AI insight</div><p style="line-height:1.6">${aiInsight()}</p></div></div><div class="sect"><h2>Today's non-negotiables</h2><button class="mini" onclick="go('lists')">Manage</button></div><div class="tasks">${S.tasks.filter(t=>t.nonneg).sort((a,b)=>pri(a)-pri(b)).map(task).join("")||`<div class="card muted">No non-negotiables yet. Make the few things that truly matter explicit.</div>`}</div><div class="sect"><h2>Remaining important work</h2><button class="mini" onclick="recovery()">Recovery Mode</button></div><div class="tasks">${S.tasks.filter(t=>t.status!=="completed").sort((a,b)=>pri(a)-pri(b)).slice(0,5).map(task).join("")||`<div class="card muted">Nothing left. Nice work.</div>`}</div>`)}
function aiInsight(){let missed=S.tasks.filter(t=>t.status==="missed").length,done=S.tasks.filter(t=>t.status==="completed").length;if(!S.tasks.length)return"Start by adding one meaningful task. Your command center will learn from what you actually do.";if(missed)return`You've missed <b>${missed}</b> task${missed>1?"s":""}. Don't pile on more work blindly — recover the 1–3 highest-value actions first.`;if(done)return`Your weighted execution score is <b>${weightedScore()}/100</b>. The system is rewarding meaningful work rather than checkbox volume.`;return`Your highest-value unfinished item is <b>${esc(S.tasks.slice().sort((a,b)=>pri(a)-pri(b))[0]?.name||"your next priority")}</b>. Protect time for it before low-value work.`}
function lists(){return shell("Lists",`<div class="hero"><div><div class="eyebrow">Organization</div><h1>Everything in one place.</h1><p>Search, filter, prioritize, reorder and clean up your lists.</p></div><button class="btn primary" onclick="taskModal()">+ New task</button></div><div class="card"><input id="search" placeholder="Search tasks, categories…" oninput="filterTasks()"><div id="results" class="tasks" style="margin-top:12px">${S.tasks.slice().sort((a,b)=>pri(a)-pri(b)).map(task).join("")||`<div class="muted">No tasks yet.</div>`}</div></div><div class="sect"><h2>Smart cleanup</h2></div><div class="card">${cleanupSuggestion()}</div>`)}
function filterTasks(){let q=$("#search").value.toLowerCase();$("#results").innerHTML=S.tasks.filter(t=>(t.name+" "+t.category+" "+t.priority).toLowerCase().includes(q)).sort((a,b)=>pri(a)-pri(b)).map(task).join("")||`<div class="muted">No matching tasks.</div>`}
function cleanupSuggestion(){let old=S.tasks.filter(t=>t.status==="skipped"||t.status==="missed");return old.length?`<b>${old.length} task${old.length>1?"s":""}</b> need attention. Repeated misses should trigger Keep / Reschedule / Reduce / Remove decisions.`:"No abandoned work detected. Keep your task list intentional."}
function calendar(){let arr=[];for(let i=1;i<=31;i++){let p=(i*19)%101;arr.push(`<div class="card" style="min-height:75px"><b>${i}</b><div class="progress" style="margin-top:15px"><i style="width:${p}%"></i></div><small class="muted">${p}%</small></div>`)}return shell("Calendar",`<div class="hero"><div><div class="eyebrow">History</div><h1>Performance calendar.</h1><p>Historical performance remains available for review.</p></div></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${arr.join("")}</div>`)}
function stats(){let v=[62,74,58,91,78,83,weightedScore()];return shell("Stats",`<div class="hero"><div><div class="eyebrow">Analytics</div><h1>Understand your performance.</h1><p>Execution is what happened today. Consistency is what happens repeatedly.</p></div></div><div class="two"><div class="card"><div class="eyebrow">Execution Score</div><div class="score">${weightedScore()}<span>/100</span></div><p class="muted">Weighted completed value.</p></div><div class="card"><div class="eyebrow">Consistency Score</div><div class="score">${consistency()}<span>/100</span></div><p class="muted">Based on stored completion history.</p></div></div><div class="card" style="margin-top:13px"><div class="sect"><h2>Weekly performance</h2><span class="muted">7-day view</span></div><div class="chart">${v.map(x=>`<div class="bar" style="height:${Math.max(5,x)}%"></div>`).join("")}</div></div><div class="two" style="margin-top:13px"><div class="card"><div class="eyebrow">Completion</div><h2>${completion()}%</h2><p class="muted">${S.tasks.filter(t=>t.status==="completed").length} of ${S.tasks.length} tasks completed.</p></div><div class="card"><div class="eyebrow">Best category</div><h2>${bestCategory()}</h2><p class="muted">Weighted completed points by category.</p></div></div>`)}
function bestCategory(){let m={};S.tasks.forEach(t=>m[t.category]=(m[t.category]||0)+(t.status==="completed"?t.weight:0));return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—"}
function consistency(){let ev=S.events.length;return Math.min(100,Math.round((Math.min(7,ev)/7)*70+30))}
function calcStreak(){return Math.min(365,Math.max(0,Math.floor(S.events.length/2)))}
function goals(){return shell("Goals",`<div class="hero"><div><div class="eyebrow">Long-term direction</div><h1>Goals become actions.</h1><p>Goal → milestones → weekly targets → daily tasks.</p></div><button class="btn primary" onclick="goalModal()">+ New goal</button></div><div class="tasks">${S.goals.map(g=>`<div class="card goal"><div><h3>${esc(g.name)}</h3><div class="muted">${esc(g.target)}</div><div class="progress" style="margin-top:12px"><i style="width:${g.progress}%"></i></div><small class="muted">${g.progress}% complete · ${esc(g.status)}</small></div><span class="status ${g.status==="On Track"?"ok":"risk"}">${esc(g.status)}</span></div>`).join("")||`<div class="card muted">No goals yet.</div>`}</div>`)}
function coach(){return shell("AI Coach",`<div class="hero"><div><div class="eyebrow">Intelligence layer</div><h1>Talk to your coach.</h1><p>Choose the conversation you need right now.</p></div></div><div class="two"><div class="card"><div class="eyebrow">✦ Productivity Coach</div><h2>Make execution smarter.</h2><p class="muted">Prioritization, workload detection, goal breakdowns, missed-task patterns, scheduling suggestions and weekly reviews.</p><button class="btn primary" onclick="coachChat('productivity')">Open conversation</button><button class="btn" style="margin-left:5px" onclick="phoneNotice()">☎ Start phone call</button></div><div class="card"><div class="eyebrow">♡ Emotional Coach</div><h2>A space to talk.</h2><p class="muted">Listen first, acknowledge context, ask thoughtful questions, then help if wanted. No diagnosis and no fake human emotions.</p><button class="btn primary" onclick="coachChat('emotional')">Open conversation</button><button class="btn" style="margin-left:5px" onclick="phoneNotice()">☎ Start phone call</button></div></div><div class="card" style="margin-top:13px"><div class="listrow"><span>Coach styles</span><b>Calm · Friendly · Direct · Strict · Encouraging</b></div><div class="listrow"><span>AI personalization</span><b>${S.settings.aiMemory?"Enabled":"Disabled"}</b></div><div class="listrow"><span>Real phone calling</span><span class="status risk">External telephony required</span></div></div>`)}
function coachChat(type){let m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="dialog"><div class="dialoghead"><h2>${type==="emotional"?"♡ Emotional Coach":"✦ Productivity Coach"}</h2><button class="icon" onclick="this.closest('.modal').remove()">×</button></div><div id="chat" style="max-height:320px;overflow:auto"><div class="card"><b>Coach</b><p>${type==="emotional"?"I'm here to listen. Tell me what is going on, and I'll focus on understanding before jumping into solutions.":"Based on the activity in this browser, your next best move is to protect your highest-priority unfinished task. What is getting in the way?"}</p></div></div><label>Your message<textarea id="cm" placeholder="Type or use the microphone…"></textarea></label><button class="btn primary" onclick="localCoach('${type}')">Send</button><button class="btn" onclick="voiceTo('#cm')">🎙 Speak</button></div>`;document.body.append(m)}
function localCoach(type){let x=$("#cm").value.trim();if(!x)return;let c=$("#chat");c.innerHTML+=`<div class="card"><b>You</b><p>${esc(x)}</p></div><div class="card"><b>Coach</b><p>${type==="emotional"?"That sounds worth slowing down for. I won't assume what you need. Do you want me to listen, help you get perspective, or work through a practical next step?":`Let's turn that into one concrete next action. Your current weighted score is ${weightedScore()}/100 and your remaining planned workload is ${S.tasks.filter(t=>t.status!=="completed").reduce((a,t)=>a+t.duration,0)} minutes. Choose the highest-value action you can realistically finish next.`}</p></div>`;$("#cm").value="";c.scrollTop=c.scrollHeight}
function phoneNotice(){toast("Real telephone calls cannot be genuine from a standalone HTML file. A telephony provider + secure server credentials are required; this button will never fake a call.")}
function review(){return shell("Daily Review",`<div class="hero"><div><div class="eyebrow">Reflection</div><h1>Review the day.</h1><p>Optional. Lightweight. Actionable.</p></div></div><div class="card"><label>Biggest achievement<textarea id="r1"></textarea></label><label>Biggest challenge<textarea id="r2"></textarea></label><label>What should improve tomorrow?<textarea id="r3"></textarea></label><button class="btn primary" onclick="saveReview()">Save review</button></div><div class="sect"><h2>Previous reviews</h2></div><div class="tasks">${S.reviews.map(r=>`<div class="card"><b>${r.date}</b><p><span class="muted">Achievement:</span> ${esc(r.a)}</p><p><span class="muted">Challenge:</span> ${esc(r.c)}</p><p><span class="muted">Tomorrow:</span> ${esc(r.t)}</p></div>`).join("")||`<div class="muted">No reviews yet.</div>`}</div>`)}
function templates(){return shell("Templates",`<div class="hero"><div><div class="eyebrow">Original templates</div><h1>Start faster.</h1><p>Use → Create Copy → Rename → Customize. Your original stays untouched.</p></div><button class="btn primary" onclick="templateUse('My Daily Command')">Create from template</button></div><div class="two"><div class="card"><div class="eyebrow">By Maanas Jain</div><h2>Daily Command</h2><p class="muted">Non-negotiables, deep work, learning, fitness and review.</p><button class="mini" onclick="templateUse('Daily Command')">Use Template</button></div><div class="card"><div class="eyebrow">By Maanas Jain</div><h2>Focused Study</h2><p class="muted">High-value study blocks, practice and review.</p><button class="mini" onclick="templateUse('Focused Study')">Use Template</button></div></div>`)}
function settings(){return shell("Settings",`<div class="hero"><div><div class="eyebrow">Control center</div><h1>Your preferences.</h1><p>Privacy, appearance, notifications, AI memory and data portability.</p></div></div><div class="card">${[["notifications","Smart notifications"],["lowData","Low-data mode"],["aiMemory","AI personalization memory"],["voice","Voice interaction"]].map(x=>`<div class="listrow"><span>${x[1]}</span><button class="mini" onclick="S.settings.${x[0]}=!S.settings.${x[0]};save();render()">${S.settings[x[0]]?"On":"Off"}</button></div>`).join("")}<div class="listrow"><span>Backup / Restore</span><div><button class="mini" onclick="backup()">Export backup</button><button class="mini" onclick="restoreFile()">Restore</button></div></div><div class="listrow"><span>Account</span><button class="mini" onclick="logout()">Log out</button></div></div><div class="by" style="text-align:center;margin-top:20px">Daily Command Center · By Maanas Jain</div>`)}
function auth(){document.body.classList.remove("light");$("#root").innerHTML=`<div class="auth"><div class="authbox"><div class="logo"><div class="mark">DC</div><div>Daily Command Center</div></div><div class="by" style="margin-left:0">By Maanas Jain</div><h1>Know What Matters.</h1><p>Do what matters. Understand yourself. Improve every day.</p><label>Name<input id="un" placeholder="Your name"></label><label>Email<input id="ue" type="email" placeholder="you@example.com"></label><button class="btn primary" style="width:100%;margin-top:8px" onclick="enter()">Enter private workspace</button><p style="font-size:11px;margin-top:14px">This standalone edition stores your workspace locally in this browser. It does not send your data to a server.</p></div></div>`}
function enter(){let name=$("#un").value.trim()||"Maanas";let email=$("#ue").value.trim()||"local@dcc";S.user={name,email};save();render()}
function logout(){S.user=null;save();render()}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";document.body.classList.toggle("light",S.theme==="light");save()}
function taskModal(id){let t=id&&S.tasks.find(x=>x.id===id),m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="dialog"><div class="dialoghead"><h2>${t?"Edit":"New"} task</h2><button class="icon" onclick="this.closest('.modal').remove()">×</button></div><label>Task<input id="tn" value="${esc(t?.name||"")}"></label><div class="twoform"><label>Priority<select id="tp">${["Critical","High","Medium","Low","Bonus"].map(x=>`<option ${x===t?.priority?"selected":""}>${x}</option>`).join("")}</select></label><label>Weight<input id="tw" type="number" min="1" value="${t?.weight||10}"></label></div><div class="twoform"><label>Duration (minutes)<input id="td" type="number" min="1" value="${t?.duration||30}"></label><label>Category<select id="tc">${["Goals","Learning","Work","Fitness","Personal","Reading","Projects","Finance","Other"].map(x=>`<option ${x===t?.category?"selected":""}>${x}</option>`).join("")}</select></label></div><div class="twoform"><label>Start time<input id="ts" type="datetime-local"></label><label>Deadline<input id="de" type="datetime-local"></label></div><label>Recurrence<select id="tr"><option>None</option><option>Daily</option><option>Weekly</option><option>Custom</option></select></label><label class="check"><input id="nn" type="checkbox" ${t?.nonneg?"checked":""}> Today's non-negotiable</label><label class="check"><input id="rm" type="checkbox" ${t?.reminder?"checked":""}> Reminder</label><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveTask('${id||""}')">Save task</button></div>`;document.body.append(m)}
function saveTask(id){let d={name:$("#tn").value.trim(),priority:$("#tp").value,weight:+$("#tw").value||10,duration:+$("#td").value||30,category:$("#tc").value,nonneg:$("#nn").checked,reminder:$("#rm").checked,recurrence:$("#tr").value==="None"?"":$("#tr").value,status:"not_started",created:Date.now()};if(!d.name)return toast("Give the task a name.");if(id){let t=S.tasks.find(x=>x.id===id),old={...t};Object.assign(t,d,{id:t.id,status:t.status});S.events.push({date:new Date().toISOString(),type:"edit",task:id,before:old})}else{d.id=crypto.randomUUID();S.tasks.push(d);S.events.push({date:new Date().toISOString(),type:"create",task:d.id})}save();document.querySelector(".modal").remove();render();toast(id?"Task updated":"Task added")}
function toggleTask(id){let t=S.tasks.find(x=>x.id===id),old=t.status;t.status=t.status==="completed"?"not_started":"completed";S.events.push({date:new Date().toISOString(),type:t.status,task:id,before:old});save();render();toast(t.status==="completed"?"Completed":"Reopened")}
function delTask(id){let i=S.tasks.findIndex(x=>x.id===id);if(i<0)return;let old=S.tasks[i];S.tasks.splice(i,1);S.events.push({date:new Date().toISOString(),type:"delete",task:id,before:old});save();render();toast("Deleted — Undo available in this session")}
function goalModal(){let m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="dialog"><div class="dialoghead"><h2>New goal</h2><button class="icon" onclick="this.closest('.modal').remove()">×</button></div><label>Goal<input id="gn"></label><label>Target<textarea id="gt"></textarea></label><label>Progress %<input id="gp" type="number" value="0" min="0" max="100"></label><button class="btn primary" style="width:100%" onclick="saveGoal()">Create goal</button></div>`;document.body.append(m)}
function saveGoal(){let n=$("#gn").value.trim();if(!n)return toast("Name the goal.");S.goals.push({id:crypto.randomUUID(),name:n,target:$("#gt").value,progress:+$("#gp").value||0,status:(+$("#gp").value||0)>=50?"On Track":"At Risk"});save();document.querySelector(".modal").remove();render()}
function saveReview(){S.reviews.unshift({date:new Date().toISOString().slice(0,10),a:$("#r1").value,c:$("#r2").value,t:$("#r3").value});save();toast("Daily review saved");render()}
function templateUse(name){let prefix=name.includes("Study")?"Study session":"Deep work";S.tasks.push({id:crypto.randomUUID(),name:prefix,priority:"High",weight:15,duration:45,category:"Learning",nonneg:true,reminder:false,recurrence:"",status:"not_started",created:Date.now()});save();toast("Template copied — customize it freely");go("lists")}
function focusMode(id){let t=S.tasks.find(x=>x.id===id),m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="dialog" style="text-align:center"><div class="eyebrow">Focus Mode</div><h1>${esc(t.name)}</h1><div id="timer" style="font-size:72px;font-weight:800;letter-spacing:-.06em;margin:25px">00:00</div><p class="muted">${t.duration} minute planned session · distraction-free</p><button class="btn primary" onclick="runTimer(${t.duration*60})">Start</button> <button class="btn" onclick="this.closest('.modal').remove()">Exit</button></div>`;document.body.append(m)}
function runTimer(sec){let el=$("#timer"),iv=setInterval(()=>{sec--;el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");if(sec<=0){clearInterval(iv);toast("Focus session complete")}},1000)}
function recovery(){let xs=S.tasks.filter(t=>t.status!=="completed").sort((a,b)=>b.weight-a.weight).slice(0,3);toast(xs.length?`Recovery: ${xs.map(x=>x.name).join(" · ")}`:"Nothing to recover.")}
function voice(){if(!S.settings.voice)return toast("Voice interaction is disabled.");let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("Speech recognition is unavailable in this browser.");let r=new R();r.lang="en-IN";r.onresult=e=>{let x=e.results[0][0].transcript;toast("Captured: "+x);taskModal();setTimeout(()=>$("#tn").value=x,80)};r.start()}
function voiceTo(sel){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("Speech recognition unavailable.");let r=new R();r.lang="en-IN";r.onresult=e=>$(sel).value=e.results[0][0].transcript;r.start()}
function backup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daily-command-center-backup.json";a.click();URL.revokeObjectURL(a.href)}
function restoreFile(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();toast("Backup restored")}catch(e){toast("Invalid backup")}};r.readAsText(f)};i.click()}
document.body.classList.toggle("light",S.theme==="light");render();
</script>
</body></html>
